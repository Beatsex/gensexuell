# AU (and the macOS VST3/CLAP/LV2) can only be built on a Mac: this runs on GitHub's macOS runners.
name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned JUCE and clap-juce-extensions
        run: |
          git clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git plugin/libs/JUCE
          git clone --recurse-submodules --shallow-submodules https://github.com/free-audio/clap-juce-extensions.git plugin/libs/clap-juce-extensions
          git -C plugin/libs/clap-juce-extensions checkout 7adee3a1bd4684d4caa5601100e364abccff4b4d

      - name: Build
        run: |
          cmake -S plugin -B plugin/build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build plugin/build --config Release --target Seedling_AU Seedling_VST3 Seedling_CLAP Seedling_LV2 EngineTest

      - name: Engine test
        working-directory: plugin
        run: build/Release/EngineTest

      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "plugin/build/Seedling_artefacts/Release/AU/gensexuell.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Sdlg Sxsl

      - uses: actions/upload-artifact@v4
        with:
          name: gensexuell-macOS
          path: |
            plugin/build/Seedling_artefacts/Release/AU
            plugin/build/Seedling_artefacts/Release/VST3
            plugin/build/Seedling_artefacts/Release/CLAP
            plugin/build/Seedling_artefacts/Release/LV2
